<!DOCTYPE html>
<html>
<head>
  <title>Log in - MPL</title>
</head>
<body>
  <nav>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'login' %}">Log in</a>
    <a href="{% url 'signup' %}">Sign up</a>
  </nav>
  <hr>

  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
  </form>

  <p>Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
</body>
</html>
